plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.23'
}

version = '1.0.5'
group = 'com.example'

base {
    archivesName = 'caravan'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.107'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        caravan {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://ldtteam.jfrog.io/ldtteam/modding' }
    mavenCentral()
}

dependencies {
    // Optional integration jars live in the game instance's mods folder, whose file
    // names carry version numbers that change on every mod update. Resolve them by
    // glob instead of a fixed path so an instance update no longer silently drops
    // them from the compile classpath (which breaks compilation of the optional
    // Waystones / EclipticSeasons integration code).
    def instanceMods = new File('F:/MC/Instances/Rome1.21.1/mods')
    def resolveModJar = { String pattern ->
        if (!instanceMods.exists()) {
            return null
        }
        def matches = instanceMods.listFiles({ File f ->
            f.isFile() && f.name.toLowerCase().matches(pattern)
        } as java.io.FileFilter)
        return matches == null || matches.length == 0
            ? null
            : matches.sort { a, b -> a.name <=> b.name }.last()
    }

    // MineColonies 1.21.1 is not published on a public Maven, so the local
    // distribution jar (in the sibling "参考" reference folder) is used for compilation.
    implementation files(rootProject.file('../参考/minecolonies-1.1.1285-1.21.1.jar'))

    // Structurize / BlockUI come from the LDT Team Maven.
    // JEI is excluded: the LDT Maven only hosts an old JEI build, and MineColonies
    // requires a newer one. JEI is optional for both MineColonies and this mod.
    // Prefer the reference Structurize jar kept next to the project (same pattern as
    // the MineColonies reference jar above) so the build no longer depends on an
    // absolute path inside one machine's game instance. NOTE: the declared runtime
    // floor in neoforge.mods.toml is [1.0.810-1.21.1-snapshot,) - compiling against a
    // newer Structurize is fine because this mod references no structurize classes.
    def referenceStructurize = rootProject.file('../参考/structurize-1.0.832-1.21.1.jar')
    if (referenceStructurize.exists()) {
        implementation files(referenceStructurize)
    } else {
        implementation("com.ldtteam:structurize:1.21.1-1.0.746-beta") {
            exclude group: 'mezz.jei'
        }
    }
    implementation("com.ldtteam:blockui:1.21.1-1.0.182-beta") {
        exclude group: 'mezz.jei'
    }
    // domum_ornamentum is a runtime-scoped dependency of structurize, but the
    // colony building tile entity hierarchy references its classes, so it must
    // also be on the compile classpath.
    implementation("com.ldtteam:domum-ornamentum:1.21.1-1.0.200-BETA") {
        exclude group: 'mezz.jei'
    }
    // Waystones（仅编译期 + 运行期可选）：交易列表页面把目标位置 100 格内的
    // Waystone 名称作为“距离”显示；未安装 Waystones 时自动降级为距离数字。
    def waystonesJar = resolveModJar('waystones-neoforge-.*\\.jar')
    if (waystonesJar != null) {
        implementation files(waystonesJar)
    }
    // Waystones 的方块实体类依赖 Balm API（同实例 mods 文件夹内）。
    def balmJar = resolveModJar('balm-neoforge-.*\\.jar')
    if (balmJar != null) {
        implementation files(balmJar)
    }
    // JourneyMap API（从实例的 journeymap jar 中提取的嵌套 API jar，编译期使用；
    // 未安装 JourneyMap 时插件类不会被加载，功能自动停用）。
    def journeyMapApiJar = file('libs/journeymap-api-neoforge-2.0.0-1.21.1.jar')
    if (journeyMapApiJar.exists()) {
        implementation files(journeyMapApiJar)
    }
    // EclipticSeasons（仅编译期 + 运行期可选）：按季节动态修改白天长度，
    // 商队夜间赶路的“日落时刻”使用其 API 计算（未安装时回退原版日落 12000）。
    def eclipticSeasonsJar = resolveModJar('eclipticseasons-.*neoforge-.*\\.jar')
    if (eclipticSeasonsJar != null) {
        implementation files(eclipticSeasonsJar)
    }
}
