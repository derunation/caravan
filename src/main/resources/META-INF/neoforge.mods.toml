modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "caravan"
    version = "1.0.3"
displayName = "Minecolonies Caravans"
description = '''A MineColonies addon that adds the Caravan Hut, the Caravan Leader/Member/Guard professions and a full caravan trading system:
record villager trades with the Caravan Marker, prepare goods through the request system, simulate long-distance trips with camping and night travel,
fulfill colony requests via on-demand trades, and show the caravan on JourneyMap while travelling.'''
authors = ["Deepseek-V4-Flash", "Derunation"]

[[mixins]]
config = "caravan.mixins.json"

[[dependencies.caravan]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.235,22.0.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.caravan]]
modId = "minecolonies"
type = "required"
versionRange = "[1.1.1285-1.21.1,)"
ordering = "AFTER"
side = "BOTH"

# Structurize 只被“配方里的 structurize:sceptergold 物品 ID”和蓝图包声明引用，
# 本模组不调用任何 structurize 类（逐版本核对过字节码：只有 blockui 类引用，
# 且 1.0.2/1.0.3 的 blockui 引用集合完全一致），因此下限保持 1.0.2 的水平，
# 不在 1.0.3 里抬高，以免连带排除旧版 Structurize 整合包的测试者。
[[dependencies.caravan]]
modId = "structurize"
type = "required"
versionRange = "[1.0.810-1.21.1-snapshot,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.caravan]]
modId = "domum_ornamentum"
type = "required"
versionRange = "[1.0.223-snapshot,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.caravan]]
modId = "blockui"
type = "required"
versionRange = "[1.0.199-1.21.1-snapshot,)"
ordering = "AFTER"
side = "BOTH"
